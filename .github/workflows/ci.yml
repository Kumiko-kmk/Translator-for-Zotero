name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check plugin/bootstrap.js
          node --check plugin/page-text-index.js
          node --check plugin/selection-block.js
          node --check plugin/front-matter-extractor.js
          node --check plugin/content-segments.js
          node --check plugin/translation-service.js

      - name: Run Node tests
        shell: pwsh
        run: |
          node tests/page-text-index.test.js
          node tests/selection-block.test.js
          node tests/translation.test.js
          node tests/translation-providers.test.js
          node tests/bootstrap.test.js
          node tests/front-matter.test.js

      - name: Build validated XPI
        shell: pwsh
        run: .\tools\build_xpi.ps1

      - name: Run package tests
        run: python -m pytest

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Translator-for-Zotero-XPI
          path: dist/Translator-for-Zotero-*.xpi
          if-no-files-found: error
